backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "cars"
    label: "Véhicules"
    files:
      - label: "Liste véhicules"
        name: "cars"
        file: "data/cars.json"
        fields:
          - label: "Cars"
            name: "cars"
            widget: "list"
            fields:
              - {label: "Nom", name: "name", widget: "string"}
              - {label: "Type", name: "type", widget: "string"}
              - {label: "Prix", name: "pricePerDay", widget: "string"}
              - {label: "Caution", name: "cautionAmount", widget: "string"}
              - {label: "Disponibilité", name: "dispo", widget: "string"}
