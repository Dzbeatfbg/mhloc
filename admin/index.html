<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MH LOCATION — Admin</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script>
    if (window.location.hash.includes("invite_token=") ||
        window.location.hash.includes("recovery_token=") ||
        window.location.hash.includes("confirmation_token=") ||
        window.location.hash.includes("email_change_token=")) {
      window.history.replaceState({}, document.title, "/admin/" + window.location.hash);
    }

    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", function(user) {
        if (!user && window.location.hash.includes("invite_token=")) {
          window.netlifyIdentity.open();
        }
        if (!user && window.location.hash.includes("recovery_token=")) {
          window.netlifyIdentity.open();
        }
      });
      window.netlifyIdentity.init();
    }
  </script>

  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
