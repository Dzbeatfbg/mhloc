<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MH Location — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#030405;--surface:#0b0c11;--surface2:#0f1016;--border:rgba(255,255,255,.08);--text:#f0f0f2;--muted:rgba(240,240,242,.5);--gold:#c9a84c;--gold2:#e8c97a;--gold-dim:rgba(201,168,76,.08);--green:#3ecf8e;--red:#e87070;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
#loginScreen{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:100%;max-width:340px;background:var(--surface);border:1px solid rgba(201,168,76,.2);border-radius:20px;padding:32px 24px;text-align:center}
.login-logo{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px}
.login-sub{font-size:13px;color:var(--muted);margin-bottom:24px}
.login-input{width:100%;padding:13px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;outline:none;text-align:center;letter-spacing:.08em;margin-bottom:10px;-webkit-appearance:none;transition:.2s}
.login-input:focus{border-color:rgba(201,168,76,.4)}
.login-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;border-radius:12px;color:#000;font-family:'Syne',sans-serif;font-weight:800;font-size:14px;cursor:pointer;transition:.2s}
.login-btn:active{transform:scale(.98)}
.login-error{font-size:12px;color:var(--red);margin-top:8px;min-height:18px}
#app{display:none;min-height:100vh}
.header{position:sticky;top:0;z-index:50;background:rgba(3,4,5,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 16px}
.header-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:54px;gap:12px}
.brand{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:3px}
.tab{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--muted);transition:.2s;font-family:'DM Sans',sans-serif;white-space:nowrap}
.tab.active{background:var(--gold-dim);border:1px solid rgba(201,168,76,.25);color:var(--gold2)}
.logout-btn{padding:6px 12px;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:.2s}
.logout-btn:hover{border-color:rgba(232,112,112,.4);color:var(--red)}
.page{display:none;max-width:1100px;margin:0 auto;padding:20px 16px 80px}
.page.active{display:block}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;text-align:center}
.stat .n{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;line-height:1}
.stat .l{font-size:11px;color:var(--muted);margin-top:4px}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.search-input{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:9px 14px;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:13px;outline:none;flex:1;min-width:140px;-webkit-appearance:none}
.search-input:focus{border-color:rgba(201,168,76,.35)}
.filter-sel{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:9px 10px;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:13px;outline:none;cursor:pointer;-webkit-appearance:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text);transition:.2s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;color:#000}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:8px}
.btn-danger{background:rgba(232,112,112,.1);border:1px solid rgba(232,112,112,.25);color:var(--red)}
.cars-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:900px){.cars-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.cars-grid{grid-template-columns:1fr}}
.car-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:.2s}
.car-card:hover{border-color:rgba(201,168,76,.25)}
.car-thumb{height:130px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:36px;position:relative;overflow:hidden}
.car-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.car-dispo{position:absolute;top:8px;right:8px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;font-family:'Syne',sans-serif}
.d-dispo{background:rgba(62,207,142,.15);border:1px solid rgba(62,207,142,.3);color:var(--green)}
.d-indispo{background:rgba(232,112,112,.12);border:1px solid rgba(232,112,112,.25);color:var(--red)}
.d-soon{background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.3);color:var(--gold2)}
.car-body{padding:12px}
.car-name{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;margin-bottom:3px;line-height:1.3}
.car-meta{font-size:11px;color:var(--muted);margin-bottom:8px}
.car-price{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;color:var(--gold);margin-bottom:10px}
.car-actions{display:flex;gap:6px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(8px);z-index:200;display:none;align-items:flex-end;justify-content:center}
@media(min-width:600px){.modal-overlay{align-items:center;padding:20px}}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid rgba(201,168,76,.15);border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:92vh;overflow-y:auto;padding:20px 16px 32px}
@media(min-width:600px){.modal{border-radius:20px;padding:24px}}
.modal-drag{width:36px;height:4px;background:rgba(255,255,255,.15);border-radius:2px;margin:0 auto 16px}
@media(min-width:600px){.modal-drag{display:none}}
.modal-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;margin-bottom:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.field input,.field select{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:11px 13px;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:.2s;-webkit-appearance:none}
.field input:focus,.field select:focus{border-color:rgba(201,168,76,.4)}
.field select option{background:#0f1016}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:400px){.form-grid{grid-template-columns:1fr}}
.modal-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.modal-actions .btn{flex:1;justify-content:center}
.save-status{font-size:12px;color:var(--muted);text-align:center;padding:8px 0}
.save-status.saving{color:var(--gold)}
.save-status.saved{color:var(--green)}
.save-status.error{color:var(--red)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(62,207,142,.1);border:1px solid rgba(62,207,142,.3);color:var(--green);padding:9px 20px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:9998;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">MH LOCATION</div>
    <div class="login-sub">Espace administration</div>
    <input class="login-input" id="pwdInput" type="password" placeholder="Mot de passe"
      autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" id="loginBtn" onclick="doLogin()">Accéder au dashboard</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div id="app">
  <div class="header">
    <div class="header-inner">
      <div class="brand">MH ADMIN</div>
      <div class="tabs">
        <button class="tab active" onclick="switchTab('vehicles',this)">🚗 Véhicules</button>
        <button class="tab" onclick="switchTab('watermark',this)">🖼 Photos</button>
      </div>
      <button class="logout-btn" onclick="doLogout()">Déco</button>
    </div>
  </div>

  <div class="page active" id="page-vehicles">
    <div class="stats" id="statsBar"></div>
    <div class="save-status" id="saveStatus"></div>
    <div class="toolbar">
      <input class="search-input" type="text" id="searchInput" placeholder="🔍 Rechercher…" oninput="filterCars()">
      <select class="filter-sel" id="filterDispo" onchange="filterCars()">
        <option value="">Toutes</option>
        <option value="dispo">Disponible</option>
        <option value="soon">Bientôt</option>
        <option value="indispo">Indisponible</option>
      </select>
      <button class="btn btn-gold" onclick="openAdd()">+ Ajouter</button>
    </div>
    <div class="cars-grid" id="carsGrid">
      <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)">Chargement…</div>
    </div>
  </div>

  <div class="page" id="page-watermark">
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px">
      <div style="font-family:'Syne',sans-serif;font-size:14px;font-weight:700;margin-bottom:14px">⚙️ Réglages logo</div>
      <div style="margin-bottom:12px">
        <label style="display:block;font-size:11px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em">Logo PNG transparent</label>
        <div id="logoBox" style="border:1px dashed rgba(201,168,76,.25);border-radius:10px;padding:14px;text-align:center;cursor:pointer;position:relative;transition:.2s;margin-bottom:14px">
          <input type="file" accept="image/*" id="logoInput" onchange="loadLogo(this)" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%">
          <div id="logoBoxContent"><div style="font-size:22px;margin-bottom:4px">📁</div><div style="font-size:12px;color:var(--muted)">Charger logo-mh.png</div></div>
        </div>
      </div>
      <div style="margin-bottom:12px">
        <label style="display:block;font-size:11px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em">Position</label>
        <select id="posSelect" onchange="reprocessAll()" style="width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;outline:none;-webkit-appearance:none">
          <option value="center">Centré</option>
          <option value="br">Bas droite</option>
          <option value="bl">Bas gauche</option>
          <option value="tr">Haut droite</option>
        </select>
      </div>
      <div style="margin-bottom:12px">
        <label style="display:block;font-size:11px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em">Opacité — <span id="opacityVal">45%</span></label>
        <input type="range" id="opacitySlider" min="10" max="90" value="45" oninput="updateSliders();reprocessAll()" style="width:100%;accent-color:var(--gold)">
      </div>
      <div style="margin-bottom:12px">
        <label style="display:block;font-size:11px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em">Taille — <span id="sizeVal">35%</span></label>
        <input type="range" id="sizeSlider" min="10" max="65" value="35" oninput="updateSliders();reprocessAll()" style="width:100%;accent-color:var(--gold)">
      </div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:12px" id="wmStats">Aucune photo chargée</div>
      <button class="btn btn-gold" style="width:100%;justify-content:center" id="dlAllBtn" onclick="downloadAll()" disabled>⬇ Tout télécharger</button>
    </div>
    <div style="background:var(--surface);border:2px dashed rgba(201,168,76,.2);border-radius:14px;padding:32px 20px;text-align:center;cursor:pointer;transition:.25s;position:relative;margin-bottom:14px" id="dropZone">
      <input type="file" accept="image/*" multiple id="photosInput" onchange="handlePhotos(this.files)" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%">
      <div style="font-size:32px;margin-bottom:8px">🚗</div>
      <div style="font-family:'Syne',sans-serif;font-size:14px;font-weight:700;margin-bottom:4px">Glissez vos photos ici</div>
      <div style="font-size:12px;color:var(--muted)">ou appuyez pour sélectionner · JPG PNG WEBP</div>
    </div>
    <div id="resultsSection" style="display:none">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px">
        <div style="font-family:'Syne',sans-serif;font-size:14px;font-weight:700" id="resultsTitle">Photos traitées</div>
        <button class="btn btn-sm" onclick="clearAll()">✕ Effacer tout</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px" id="photosGrid"></div>
    </div>
    <div id="wmEmpty" style="text-align:center;padding:40px 20px;color:var(--muted)">
      <div style="font-size:36px;margin-bottom:10px">📸</div>
      <div>Uploadez des photos pour appliquer le logo</div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-drag"></div>
    <div class="modal-title" id="modalTitle">Ajouter un véhicule</div>
    <div class="form-grid">
      <div class="field" style="grid-column:1/-1"><label>Nom</label><input id="fName" placeholder="ex: Mercedes A45s 2025"></div>
      <div class="field"><label>Type</label>
        <select id="fType"><option value="sportive">Sportive</option><option value="citadine">Citadine</option><option value="suv">SUV</option></select>
      </div>
      <div class="field"><label>Disponibilité</label>
        <select id="fDispo"><option value="dispo">Disponible</option><option value="soon">Bientôt</option><option value="indispo">Indisponible</option></select>
      </div>
      <div class="field"><label>Prix / jour (€)</label><input id="fPrice" type="number" placeholder="149"></div>
      <div class="field"><label>Caution</label><input id="fCaution" placeholder="3 500€"></div>
      <div class="field"><label>Boîte</label><input id="fGear" placeholder="Automatique"></div>
      <div class="field"><label>Carburant</label><input id="fFuel" placeholder="Essence"></div>
      <div class="field" style="grid-column:1/-1"><label>Image principale</label><input id="fImg" placeholder="cars/a45s/merco1.png"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="deleteBtn" onclick="deleteCar()" style="display:none">🗑 Supprimer</button>
      <button class="btn" onclick="closeModal()">Annuler</button>
      <button class="btn btn-gold" onclick="saveCar()">✓ Enregistrer</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══ AUTH ══
var AUTH_KEY = "mh_admin_v1";

async function doLogin(){
  var val = document.getElementById("pwdInput").value.trim();
  if(!val) return;
  var btn = document.getElementById("loginBtn");
  btn.textContent = "Vérification…"; btn.disabled = true;
  document.getElementById("loginError").textContent = "";
  try {
    var res = await fetch("/.netlify/functions/admin-auth", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({password: val})
    });
    var data = await res.json();
    if(data.success){
      sessionStorage.setItem(AUTH_KEY, "1");
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("app").style.display = "block";
      initApp();
    } else {
      document.getElementById("loginError").textContent = "Mot de passe incorrect";
      document.getElementById("pwdInput").value = "";
      document.getElementById("pwdInput").focus();
    }
  } catch(e) {
    document.getElementById("loginError").textContent = "Erreur réseau";
  }
  btn.textContent = "Accéder au dashboard"; btn.disabled = false;
}

function doLogout(){
  sessionStorage.removeItem(AUTH_KEY);
  document.getElementById("app").style.display = "none";
  document.getElementById("loginScreen").style.display = "flex";
  document.getElementById("pwdInput").value = "";
}

if(sessionStorage.getItem(AUTH_KEY) === "1"){
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.addEventListener("DOMContentLoaded", initApp);
}

// ══ DONNÉES ══
var CARS = [];
var editIdx = -1;
var saveTimeout = null;
var DISPO_LABELS = {dispo:"Disponible",soon:"Bientôt",indispo:"Indisponible"};

async function initApp(){
  setStatus("Chargement…","saving");
  await loadCars();
  renderStats();
  renderCars(CARS);
  autoLoadLogo();
  updateSliders();
  setStatus("","");
}

function setStatus(msg, cls){
  var el = document.getElementById("saveStatus");
  el.textContent = msg;
  el.className = "save-status" + (cls?" "+cls:"");
}

async function loadCars(){
  try {
    var res = await fetch("/.netlify/functions/get-cars");
    if(!res.ok) throw new Error();
    var data = await res.json();
    CARS = Array.isArray(data) ? data : [];
  } catch(e){ CARS = []; }
}

async function saveCars(){
  setStatus("Sauvegarde en cours…","saving");
  try {
    var res = await fetch("/.netlify/functions/save-cars",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(CARS)
    });
    if(!res.ok) throw new Error();
    setStatus("✅ Sauvegardé — le site sera mis à jour dans 1-2 min","saved");
    showToast("💾 Sauvegardé !");
    setTimeout(()=>setStatus("",""),5000);
  } catch(e){
    setStatus("❌ Erreur sauvegarde","error");
    showToast("❌ Erreur sauvegarde");
  }
}

function autoSave(){
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(saveCars, 1000);
}

// ══ STATS ══
function renderStats(){
  var total=CARS.length,dispo=CARS.filter(c=>c.dispo==="dispo").length;
  var indispo=CARS.filter(c=>c.dispo==="indispo").length;
  var min=CARS.length?Math.min(...CARS.map(c=>c.pricePerDay)):0;
  document.getElementById("statsBar").innerHTML=`
    <div class="stat"><div class="n">${total}</div><div class="l">Véhicules</div></div>
    <div class="stat"><div class="n" style="color:var(--green)">${dispo}</div><div class="l">Disponibles</div></div>
    <div class="stat"><div class="n" style="color:var(--red)">${indispo}</div><div class="l">Indisponibles</div></div>
    <div class="stat"><div class="n">${min}€</div><div class="l">À partir de</div></div>`;
}

// ══ RENDER ══
function renderCars(list){
  renderStats();
  var grid=document.getElementById("carsGrid");
  if(!list.length){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)">Aucun véhicule</div>';return}
  var DC={dispo:"d-dispo",soon:"d-soon",indispo:"d-indispo"};
  grid.innerHTML=list.map(function(car){
    var ri=CARS.indexOf(car);
    return `<div class="car-card">
      <div class="car-thumb">
        <img src="${car.images?car.images[0]:''}" alt="${car.name}" onerror="this.style.display='none'">
        <div class="car-dispo ${DC[car.dispo]||'d-dispo'}">${DISPO_LABELS[car.dispo]||car.dispo}</div>
      </div>
      <div class="car-body">
        <div class="car-name">${car.name}</div>
        <div class="car-meta">${car.gearbox} · ${car.fuel}</div>
        <div class="car-price">${car.pricePerDay}€<span style="font-size:11px;font-weight:400;color:var(--muted);font-family:'DM Sans',sans-serif">/j</span></div>
        <div class="car-actions">
          <button class="btn btn-sm btn-gold" onclick="openEdit(${ri})">✏️ Modifier</button>
          <button class="btn btn-sm" onclick="quickToggle(${ri})">🔄</button>
        </div>
      </div>
    </div>`;
  }).join("");
}

function filterCars(){
  var q=document.getElementById("searchInput").value.toLowerCase();
  var d=document.getElementById("filterDispo").value;
  renderCars(CARS.filter(function(c){
    return(!q||[c.name,c.type,c.gearbox].join(" ").toLowerCase().includes(q))&&(!d||c.dispo===d);
  }));
}

function quickToggle(idx){
  var order=["dispo","soon","indispo"];
  CARS[idx].dispo=order[(order.indexOf(CARS[idx].dispo)+1)%3];
  filterCars();autoSave();
  showToast("Dispo → "+DISPO_LABELS[CARS[idx].dispo]);
}

// ══ MODAL ══
function openAdd(){
  editIdx=-1;
  document.getElementById("modalTitle").textContent="Ajouter un véhicule";
  document.getElementById("deleteBtn").style.display="none";
  ["fName","fPrice","fCaution","fGear","fFuel","fImg"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("fType").value="citadine";
  document.getElementById("fDispo").value="dispo";
  document.getElementById("modalOverlay").classList.add("open");
  setTimeout(()=>document.getElementById("fName").focus(),100);
}

function openEdit(idx){
  editIdx=idx; var c=CARS[idx];
  document.getElementById("modalTitle").textContent="Modifier — "+c.name;
  document.getElementById("deleteBtn").style.display="inline-flex";
  document.getElementById("fName").value=c.name;
  document.getElementById("fType").value=c.type;
  document.getElementById("fDispo").value=c.dispo;
  document.getElementById("fPrice").value=c.pricePerDay;
  document.getElementById("fCaution").value=c.caution;
  document.getElementById("fGear").value=c.gearbox;
  document.getElementById("fFuel").value=c.fuel;
  document.getElementById("fImg").value=c.images?c.images[0]:"";
  document.getElementById("modalOverlay").classList.add("open");
}

function closeModal(){ document.getElementById("modalOverlay").classList.remove("open"); }

function saveCar(){
  var name=document.getElementById("fName").value.trim();
  if(!name){alert("Nom requis");return}
  var imgs = editIdx>=0 ? CARS[editIdx].images : [];
  var newImg = document.getElementById("fImg").value;
  if(newImg && (imgs.length===0||imgs[0]!==newImg)) imgs=[newImg,...imgs.slice(1)];
  var data={
    id:editIdx>=0?CARS[editIdx].id:name.toLowerCase().replace(/\s+/g,"-").replace(/[^a-z0-9-]/g,""),
    name,type:document.getElementById("fType").value,
    dispo:document.getElementById("fDispo").value,
    pricePerDay:parseInt(document.getElementById("fPrice").value)||0,
    caution:document.getElementById("fCaution").value,
    gearbox:document.getElementById("fGear").value,
    fuel:document.getElementById("fFuel").value,
    seats:editIdx>=0?(CARS[editIdx].seats||"5 places"):"5 places",
    doors:editIdx>=0?(CARS[editIdx].doors||"5 portes"):"5 portes",
    conditions:editIdx>=0?(CARS[editIdx].conditions||"Permis valide / CNI / CB"):"Permis valide / CNI / CB",
    km:editIdx>=0?(CARS[editIdx].km||"Selon offre"):"Selon offre",
    images:imgs.length?imgs:[""]
  };
  if(editIdx>=0)CARS[editIdx]=data;else CARS.push(data);
  closeModal();filterCars();autoSave();
  showToast(editIdx>=0?"✅ Mis à jour":"✅ Ajouté");
}

function deleteCar(){
  if(!confirm("Supprimer ?"))return;
  CARS.splice(editIdx,1);closeModal();filterCars();autoSave();
  showToast("🗑 Supprimé");
}

document.getElementById("modalOverlay").addEventListener("click",function(e){if(e.target===this)closeModal()});

function switchTab(tab,el){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.getElementById("page-"+tab).classList.add("active");
  el.classList.add("active");
}

// ══ WATERMARK ══
var logoImg=null,wmItems=[];

function autoLoadLogo(){
  var img=new Image();
  img.onload=function(){
    logoImg=img;
    var c=document.createElement("canvas");c.width=img.width;c.height=img.height;
    c.getContext("2d").drawImage(img,0,0);
    document.getElementById("logoBoxContent").innerHTML='<img src="'+c.toDataURL()+'" style="max-height:44px;max-width:100%;object-fit:contain;display:block;margin:0 auto" alt="logo">';
  };
  img.src="logo-mh.png";
}

function loadLogo(input){
  if(!input.files[0])return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){logoImg=img;document.getElementById("logoBoxContent").innerHTML='<img src="'+e.target.result+'" style="max-height:44px;max-width:100%;object-fit:contain;display:block;margin:0 auto" alt="logo">';if(wmItems.length)reprocessAll();showToast("✅ Logo chargé")};
    img.src=e.target.result;
  };
  reader.readAsDataURL(input.files[0]);
}

function updateSliders(){
  document.getElementById("opacityVal").textContent=document.getElementById("opacitySlider").value+"%";
  document.getElementById("sizeVal").textContent=document.getElementById("sizeSlider").value+"%";
}

function handlePhotos(files){
  if(!files.length)return;
  document.getElementById("resultsSection").style.display="block";
  document.getElementById("wmEmpty").style.display="none";
  var newItems=Array.from(files).map(f=>({file:f,src:null,canvas:null}));
  wmItems=[...wmItems,...newItems];
  var loaded=0;
  newItems.forEach(item=>{
    var reader=new FileReader();
    reader.onload=e=>{item.src=e.target.result;loaded++;if(loaded===newItems.length)renderWatermarks()};
    reader.readAsDataURL(item.file);
  });
}

function renderWatermarks(){
  var grid=document.getElementById("photosGrid");grid.innerHTML="";
  wmItems.forEach((item,idx)=>{
    var div=document.createElement("div");div.style.cssText="background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden";
    var canvas=document.createElement("canvas");item.canvas=canvas;canvas.style.cssText="width:100%;display:block";
    var footer=document.createElement("div");footer.style.cssText="padding:7px 10px;display:flex;align-items:center;gap:6px";
    footer.innerHTML=`<span style="font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1" title="${item.file.name}">${item.file.name}</span><button onclick="downloadOne(${idx})" style="padding:5px 9px;font-size:11px;border-radius:7px;background:var(--gold-dim);border:1px solid rgba(201,168,76,.25);color:var(--gold2);cursor:pointer;font-weight:600;font-family:'DM Sans',sans-serif">⬇</button><button onclick="removeWm(${idx})" style="padding:5px 7px;font-size:11px;border-radius:7px;background:transparent;border:1px solid var(--border);color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif">✕</button>`;
    div.appendChild(canvas);div.appendChild(footer);grid.appendChild(div);
    applyWatermark(item);
  });
  updateWmStats();
}

function applyWatermark(item,cb){
  var img=new Image();
  img.onload=function(){
    var c=item.canvas;c.width=img.width;c.height=img.height;
    var ctx=c.getContext("2d");ctx.drawImage(img,0,0);
    if(logoImg){
      var opacity=parseInt(document.getElementById("opacitySlider").value)/100;
      var sizeRatio=parseInt(document.getElementById("sizeSlider").value)/100;
      var pos=document.getElementById("posSelect").value;
      var lw=img.width*sizeRatio,lh=(logoImg.height/logoImg.width)*lw,pad=Math.max(img.width*0.03,16);
      var lx,ly;
      if(pos==="center"){lx=(img.width-lw)/2;ly=(img.height-lh)/2}
      else if(pos==="br"){lx=img.width-lw-pad;ly=img.height-lh-pad}
      else if(pos==="bl"){lx=pad;ly=img.height-lh-pad}
      else{lx=img.width-lw-pad;ly=pad}
      ctx.globalAlpha=opacity;ctx.drawImage(logoImg,lx,ly,lw,lh);ctx.globalAlpha=1;
    }
    if(cb)cb();
  };
  img.src=item.src;
}

function reprocessAll(){wmItems.forEach(item=>{if(item.canvas&&item.src)applyWatermark(item)})}

function downloadOne(idx){
  var item=wmItems[idx];if(!item?.canvas)return;
  var a=document.createElement("a");
  a.download=item.file.name.replace(/\.[^.]+$/,"")+"_mh.jpg";
  a.href=item.canvas.toDataURL("image/jpeg",.92);a.click();
  showToast("⬇ Téléchargé");
}

async function downloadAll(){
  for(var i=0;i<wmItems.length;i++){await new Promise(r=>setTimeout(r,120));downloadOne(i)}
  showToast("⬇ "+wmItems.length+" photos téléchargées");
}

function removeWm(idx){
  wmItems.splice(idx,1);
  if(!wmItems.length){document.getElementById("resultsSection").style.display="none";document.getElementById("wmEmpty").style.display="block"}
  else renderWatermarks();
  updateWmStats();
}

function clearAll(){
  wmItems=[];
  document.getElementById("resultsSection").style.display="none";
  document.getElementById("wmEmpty").style.display="block";
  updateWmStats();
}

function updateWmStats(){
  var n=wmItems.length;
  document.getElementById("wmStats").textContent=n?n+" photo"+(n>1?"s":"")+" chargée"+(n>1?"s":""):"Aucune photo chargée";
  document.getElementById("dlAllBtn").disabled=n===0;
}

var dz=document.getElementById("dropZone");
dz.addEventListener("dragover",e=>{e.preventDefault();dz.style.borderColor="rgba(201,168,76,.5)"});
dz.addEventListener("dragleave",()=>dz.style.borderColor="rgba(201,168,76,.2)");
dz.addEventListener("drop",e=>{e.preventDefault();dz.style.borderColor="rgba(201,168,76,.2)";handlePhotos(e.dataTransfer.files)});

// ══ TOAST ══
var toastTimer;
function showToast(msg){
  var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2400);
}
</script>
